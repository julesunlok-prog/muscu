<!doctype html>
<!-- Page de diagnostic temporaire : quelle méthode de retour haptique marche sur l'iPhone de Jules ? À supprimer ensuite. -->
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test haptique</title>
<style>
  body { font: 17px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f5; } }
  button { display: block; width: 100%; height: 56px; margin: 12px 0; border: 0; border-radius: 999px; background: #1D5FBF; color: #fff; font-size: 17px; font-weight: 600; }
  .ligne { display: flex; align-items: center; justify-content: space-between; margin: 20px 0; }
  p { color: #6b6b6b; font-size: 15px; }
</style></head><body>
<h1 style="font-size:22px">Test du retour haptique</h1>
<p id="info"></p>
<div class="ligne"><span>1. Touche cet interrupteur toi-même</span><input type="checkbox" switch></div>
<button id="b2">2. Interrupteur caché (display: none)</button>
<button id="b3">3. Interrupteur invisible (méthode de l'app)</button>
<p>Dis-moi quels numéros font vibrer. Si même le 1 ne vibre pas : Réglages → Sons et vibrations → Retour haptique du système doit être activé.</p>
<script>
  document.getElementById('info').textContent = navigator.userAgent.match(/OS [\d_]+/)?.[0].replace(/_/g, '.') ?? navigator.userAgent;
  const essai = style => {
    const l = document.createElement('label');
    l.innerHTML = '<input type="checkbox" switch>'; l.style.cssText = style;
    document.body.appendChild(l); l.click(); l.remove();
  };
  document.getElementById('b2').onclick = () => essai('display:none');
  document.getElementById('b3').onclick = () => essai('position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none');
</script>
</body></html>
