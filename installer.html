<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Installer Muscu</title>
<meta name="description" content="Installe Muscu sur ton téléphone en 3 étapes.">
<meta name="theme-color" content="#F2F2F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // Ouverte depuis l'écran d'accueil (l'icône ajoutée ici) : direction l'app.
  // ?partage : ouverte depuis Réglages pour montrer le QR code à un ami, on reste ici.
  if ((matchMedia('(display-mode: standalone)').matches || navigator.standalone) && !location.search.includes('partage')) location.replace('./#/programmes');
</script>
<style>
  body { background: var(--ground); color: var(--text); margin: 0; }
  .page { max-width: 520px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(40px + var(--bas)); }
  .hero { text-align: center; padding: 8px 0 20px; }
  .hero img { width: 84px; height: 84px; border-radius: 20px; box-shadow: var(--pop); animation: rise .5s var(--out) both; }
  .hero h1 { font-size: 34px; letter-spacing: -.03em; margin: 16px 0 6px; color: var(--title); }
  .hero p { margin: 0 auto; max-width: 34ch; color: var(--muted); }
  .puces-info { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .puces-info span { font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: var(--pilule); background: var(--surface); color: var(--muted); }
  .choix { display: flex; justify-content: center; margin: 4px 0 16px; }
  .progres { height: 6px; border-radius: var(--pilule); background: var(--track); overflow: hidden; margin: 0 4px 6px; }
  .progres i { display: block; height: 100%; width: 0; background: var(--pos); border-radius: inherit; transition: width .5s var(--out); }
  .progres-txt { font-size: 13px; color: var(--muted); margin: 0 4px 14px; }
  .etape { background: var(--surface); border-radius: var(--r-lg); margin-bottom: 10px; overflow: hidden; transition: opacity .3s; }
  .etape-tete { display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px 18px; border: 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; background: var(--chip); color: var(--text); transition: background .3s, color .3s; }
  .etape.faite .num { background: var(--pos); color: var(--sur-couleur); }
  .etape-tete b { font-weight: 600; font-size: 16px; flex: 1; }
  .etape-tete .chev { color: var(--faint); transition: transform .3s var(--out); }
  .etape.ouverte .chev { transform: rotate(180deg); }
  .etape-corps { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--out); }
  .etape.ouverte .etape-corps { grid-template-rows: 1fr; }
  .etape-corps > div { overflow: hidden; }
  .etape-corps .dedans { padding: 0 18px 18px 60px; }
  .etape:not(.ouverte).faite { opacity: .75; }
  ol.gestes { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 10px; }
  ol.gestes li { display: flex; align-items: center; gap: 12px; }
  .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--raised); display: grid; place-items: center; color: var(--accent); }
  .ic svg { width: 22px; height: 22px; }
  .note { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .alerte { background: var(--warn-bg); color: var(--warn-ink); border-radius: var(--r-md); padding: 10px 12px; font-size: 14px; margin: 0 0 12px; }
  .ok { background: var(--pos-bg); color: var(--pos-ink); border-radius: var(--r-md); padding: 10px 12px; font-size: 14px; font-weight: 500; margin: 0 0 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .btn { flex: 1 1 auto; }
  .lien { background: none; border: 0; padding: 0; font: inherit; font-size: 14px; color: var(--accent-ink); text-decoration: underline; cursor: pointer; margin-top: 12px; }
  .fin { text-align: center; padding: 18px; }
  .fin .gros { font-size: 40px; line-height: 1; }
  .partage { text-align: center; }
  .qr { width: 220px; max-width: 70vw; margin: 6px auto 14px; padding: 14px; background: #FFFFFF; border-radius: var(--r-lg); color: #000000; }
  .qr svg { display: block; width: 100%; height: auto; }
  /* Flèche animée vers le bouton du navigateur à toucher (Partager / ⋯ / ⋮). */
  .doigt { position: fixed; z-index: 50; width: 54px; height: 54px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center;
    box-shadow: var(--pop); pointer-events: none; animation: tape 1.4s var(--out) infinite; }
  .doigt svg { width: 26px; height: 26px; }
  .doigt.haut { top: calc(8px + env(safe-area-inset-top, 0px)); right: 12px; }
  .doigt.bas { bottom: calc(70px + var(--bas)); right: 16px; }
  .doigt.bas svg { transform: rotate(180deg); }
  @keyframes tape { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(var(--sens, -8px)); } }
  .doigt.bas { --sens: 8px; }
  @media (prefers-reduced-motion: reduce) { .doigt { animation: none; } .etape-corps, .progres i { transition: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <img src="icones/icone-192.png" alt="" width="84" height="84">
    <h1>Muscu</h1>
    <p>Ton journal de séances, avec des conseils de progression fondés sur des études.</p>
    <div class="puces-info"><span>Gratuit</span><span>Sans compte</span><span>Tes données restent sur ton téléphone</span></div>
  </header>

  <section class="card" id="ordi" hidden style="text-align:center">
    <h2 class="card-title">Ouvre cette page sur ton téléphone</h2>
    <p class="note" style="margin-top:6px">Scanne ce QR code avec l’appareil photo.</p>
    <div class="qr" data-qr></div>
  </section>

  <div id="tuto">
    <div class="choix"><div class="seg" role="group" aria-label="Ton téléphone">
      <button type="button" data-os="ios">iPhone</button><button type="button" data-os="android">Android</button></div></div>
    <div class="progres" aria-hidden="true"><i></i></div>
    <p class="progres-txt" aria-live="polite"></p>
    <div id="etapes"></div>
  </div>

  <section class="card partage">
    <h2 class="card-title">Partager l’app</h2>
    <p class="note" style="margin-top:6px">Fais scanner ce QR code à un ami, ou envoie-lui le lien.</p>
    <div class="qr" data-qr></div>
    <div class="actions"><button class="btn btn-secondary" data-copier>Copier le lien</button><button class="btn btn-primary" data-partager hidden>Partager</button></div>
  </section>
</main>
<div class="doigt" hidden aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const ICI = location.origin + location.pathname, APP = new URL('./', location.href).href;
const ua = navigator.userAgent;
const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const android = /Android/.test(ua);
const integre = /FBAN|FBAV|Instagram|Snapchat|Line\/|TikTok|musical_ly|WhatsApp|Messenger|GSA\//.test(ua); // navigateur intégré d'une app
const chromeIos = /CriOS/.test(ua), safariIos = ios && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua) && !integre;
const chromeAndroid = android && /Chrome\//.test(ua) && !/wv\)|SamsungBrowser|OPR|EdgA|Firefox|YaBrowser/.test(ua) && !integre;

const lire = k => { try { return JSON.parse(localStorage.getItem('muscu:installer')) ?? {}; } catch { return {}; } };
const ecrire = v => { try { localStorage.setItem('muscu:installer', JSON.stringify(v)); } catch { /* navigation privée */ } };
let memo = lire(), os = memo.os ?? (android ? 'android' : 'ios'), avecSafari = memo.safari ?? false, faites = new Set(memo.faites ?? []), ouverte = null;
let invite = null; // Android : invite d'installation native de Chrome
addEventListener('beforeinstallprompt', e => { e.preventDefault(); invite = e; dessiner(); });
addEventListener('appinstalled', () => { faites.add('ajouter'); dessiner(); });

// Icônes des boutons du navigateur, comme à l'écran.
const I = {
  partager: '<path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/>',
  plus: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>',
  points: '<circle cx="6" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18" cy="12" r="1.4" fill="currentColor"/>',
  kebab: '<circle cx="12" cy="6" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="18" r="1.4" fill="currentColor"/>',
  interrupteur: '<rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="16" cy="12" r="3" fill="currentColor"/>',
  coche: '<path d="M5 12l5 5 9-10"/>',
  maison: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  chrono: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/>',
  disque: '<path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
  oeil: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
};
const ic = n => `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg></span>`;
const gestes = l => `<ol class="gestes">${l.map(([i, t]) => `<li>${ic(i)}<span>${t}</span></li>`).join('')}</ol>`;
const fait = (id, txt = 'C’est fait') => `<button class="btn btn-primary btn-bloc" data-fait="${id}">${txt}</button>`;

function etapes() {
  const dansChrome = os === 'ios' ? chromeIos : chromeAndroid, bonNav = dansChrome || (os === 'ios' && avecSafari && safariIos);
  const nav = os === 'ios' && avecSafari ? 'Safari' : 'Chrome';
  const ouvrir = {
    id: 'ouvrir', titre: `Ouvre cette page dans ${nav}`, auto: bonNav,
    corps: bonNav ? `<p class="ok">Parfait, tu es dans ${nav}.</p>${fait('ouvrir', 'Étape suivante')}`
      : `${integre ? '<p class="alerte">Tu es dans le navigateur d’une autre app (WhatsApp, Instagram…) : elle ne peut pas installer Muscu.</p>' : ''}
        <p class="note">${nav === 'Chrome' ? 'Chrome installe l’app proprement sur ton écran d’accueil, avec les notifications de fin de repos.' : 'Safari est le navigateur d’origine de l’iPhone.'}</p>
        <div class="actions">${nav === 'Chrome' ? '<button class="btn btn-primary" data-chrome>Ouvrir dans Chrome</button>' : ''}<button class="btn btn-secondary" data-copier>Copier le lien</button></div>
        <p class="note" style="margin:10px 0 0">${nav === 'Chrome' ? 'Si rien ne s’ouvre, installe Chrome depuis l’' + (os === 'ios' ? 'App Store' : 'Play Store') + ', ou colle le lien dans Chrome.' : 'Colle le lien dans Safari.'}</p>`,
  };
  const iosGestes = avecSafari ? [
    ['points', 'Touche <b>⋯</b> à côté de la barre d’adresse'], ['partager', 'Touche <b>Partager</b>'],
    ['plus', 'Fais défiler et touche <b>Ajouter à l’écran d’accueil</b>'], ['interrupteur', 'Laisse <b>Ouvrir en tant qu’app web</b> activé'], ['coche', 'Touche <b>Ajouter</b>'],
  ] : [
    ['partager', 'Touche <b>Partager</b>, en haut à droite'], ['plus', 'Fais défiler et touche <b>Ajouter à l’écran d’accueil</b>'],
    ['interrupteur', 'Laisse <b>Ouvrir en tant qu’app web</b> activé s’il apparaît'], ['coche', 'Touche <b>Ajouter</b>'],
  ];
  const ajouter = {
    id: 'ajouter', titre: 'Ajoute Muscu à ton écran d’accueil', doigt: os === 'ios' ? (avecSafari ? 'bas' : 'haut') : 'haut',
    corps: os === 'android' && invite ? `<p class="note">Chrome peut l’installer directement :</p><button class="btn btn-primary btn-bloc" data-installer>Installer Muscu</button>`
      : (os === 'ios' ? gestes(iosGestes) : gestes([['kebab', 'Touche <b>⋮</b>, en haut à droite'], ['plus', 'Touche <b>Ajouter à l’écran d’accueil</b> (ou <b>Installer l’application</b>)'], ['coche', 'Touche <b>Installer</b>']]))
        + fait('ajouter', 'C’est fait, je vois l’icône'),
  };
  const lancer = {
    id: 'lancer', titre: 'Ouvre Muscu depuis l’icône',
    corps: `${gestes([['maison', 'Va sur ton écran d’accueil et touche l’icône <b>Muscu</b>']])}
      <p class="note">Toujours depuis l’icône, pas depuis ${nav} : c’est là que l’app s’ouvre en plein écran, marche sans réseau et peut sonner à la fin du repos.</p>
      <div class="actions"><a class="btn btn-secondary" href="${APP}">Ouvrir ici en attendant</a>${fait('lancer', 'C’est fait')}</div>`,
  };
  const regler = {
    id: 'regler', titre: 'Les 3 réglages utiles',
    corps: `${gestes([
      ['oeil', '<b>Voir la démo</b> sur l’écran Entraînement : 12 semaines fictives pour tout découvrir'],
      ['chrono', '<b>Réglages → Alarme de repos</b> : demande le code à la personne qui t’a partagé l’app'],
      ['disque', '<b>Sauvegarde</b> : un rappel tous les 15 jours. Garde le fichier dans Fichiers ou iCloud : supprimer l’icône efface tout'],
    ])}${fait('regler', 'Terminé')}`,
  };
  return [ouvrir, ajouter, lancer, regler];
}

const $ = s => document.querySelector(s);
function dessiner() {
  const l = etapes();
  for (const e of l) if (e.auto) faites.add(e.id);
  ouverte = ouverte && !faites.has(ouverte) ? ouverte : (l.find(e => !faites.has(e.id))?.id ?? null);
  const n = l.filter(e => faites.has(e.id)).length;
  $('.progres i').style.width = `${n / l.length * 100}%`;
  $('.progres-txt').textContent = n === l.length ? 'Tout est prêt.' : `Étape ${l.findIndex(e => e.id === ouverte) + 1} sur ${l.length}`;
  $('#etapes').innerHTML = l.map((e, i) => `<section class="etape ${faites.has(e.id) ? 'faite' : ''} ${e.id === ouverte ? 'ouverte' : ''}">
      <button class="etape-tete" data-ouvrir="${e.id}" aria-expanded="${e.id === ouverte}"><span class="num">${faites.has(e.id) ? '✓' : i + 1}</span><b>${e.titre}</b>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="etape-corps" ${e.id === ouverte ? '' : 'inert'}><div><div class="dedans">${e.corps}
        ${e.id === 'ouvrir' && os === 'ios' ? `<button class="lien" data-safari>${avecSafari ? 'Utiliser Chrome plutôt' : 'Pas Chrome ? Safari marche aussi'}</button>` : ''}</div></div></div></section>`).join('')
    + (n === l.length ? `<section class="card fin"><div class="gros">💪</div><h2 class="card-title" style="margin-top:8px">Bonne séance !</h2>
        <p class="note" style="margin:6px 0 0">Tu peux fermer cette page et ouvrir Muscu depuis ton écran d’accueil.</p></section>` : '');
  document.querySelectorAll('[data-os]').forEach(b => b.setAttribute('aria-pressed', b.dataset.os === os));
  const d = l.find(e => e.id === ouverte)?.doigt, doigt = $('.doigt');
  doigt.hidden = !d || !(os === 'ios' ? ios : android) || (os === 'android' && invite);
  doigt.className = `doigt ${d ?? ''}`;
  ecrire({ os, safari: avecSafari, faites: [...faites] });
  document.querySelectorAll('[data-partager]').forEach(b => { b.hidden = !navigator.share; });
}

function copier() {
  const fini = () => toastSimple('Lien copié');
  if (navigator.clipboard) navigator.clipboard.writeText(ICI).then(fini, () => prompt('Copie ce lien :', ICI));
  else prompt('Copie ce lien :', ICI);
}
function toastSimple(t) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = t; el.setAttribute('role', 'status');
  Object.assign(el.style, { position: 'fixed', left: '50%', bottom: 'calc(24px + env(safe-area-inset-bottom, 0px))', transform: 'translateX(-50%)', background: 'var(--tip)', color: 'var(--tip-ink)',
    padding: '10px 16px', borderRadius: '999px', fontWeight: 600, fontSize: '14px', zIndex: 60 });
  document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.os) { os = t.dataset.os; ouverte = null; dessiner(); }
  if (t.dataset.ouvrir) { ouverte = ouverte === t.dataset.ouvrir ? null : t.dataset.ouvrir; dessiner(); }
  if (t.dataset.fait) { faites.add(t.dataset.fait); ouverte = null; dessiner(); if (navigator.vibrate) navigator.vibrate(15); }
  if (t.hasAttribute('data-safari')) { avecSafari = !avecSafari; faites.delete('ouvrir'); ouverte = 'ouvrir'; dessiner(); }
  if (t.hasAttribute('data-copier')) copier();
  if (t.hasAttribute('data-partager')) navigator.share({ title: 'Muscu', text: 'Mon app de muscu : installe-la en 3 étapes', url: ICI }).catch(() => {});
  if (t.hasAttribute('data-chrome')) {
    const sans = ICI.replace(/^https?:\/\//, '');
    location.href = os === 'ios' ? 'googlechromes://' + sans : `intent://${sans}#Intent;scheme=https;package=com.android.chrome;end`;
  }
  if (t.hasAttribute('data-installer') && invite) { invite.prompt(); const r = await invite.userChoice; invite = null; if (r.outcome === 'accepted') faites.add('ajouter'); dessiner(); }
});

// QR code de cette page (lien de partage), dessiné en SVG pour rester net à toutes les tailles.
function qr() {
  if (!window.qrcode) return document.querySelectorAll('[data-qr]').forEach(x => { x.textContent = ICI; x.style.fontSize = '12px'; });
  const q = qrcode(0, 'M'); q.addData(ICI); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  document.querySelectorAll('[data-qr]').forEach(x => { x.innerHTML = `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges" role="img" aria-label="QR code vers ${ICI}"><path fill="currentColor" d="${d}"/></svg>`; });
}

if (location.search.includes('partage')) { // montrer le QR code à un ami : le partage d'abord, sans le tuto
  $('#tuto').hidden = true; $('.page').insertBefore($('.partage'), $('#tuto'));
  $('.partage').insertAdjacentHTML('beforeend', `<a class="btn btn-texte btn-bloc" href="${APP}" style="margin-top:8px">Retour à l’app</a>`);
} else if (!ios && !android) { $('#ordi').hidden = false; }
qr();
dessiner();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); // l'app marche hors ligne dès l'installation
</script>
</body>
</html>
