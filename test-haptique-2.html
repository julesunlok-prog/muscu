<!doctype html>
<!-- Page de diagnostic temporaire : un vrai toucher sur un bouton qui contient un interrupteur caché fait-il vibrer (iOS 26) ? À supprimer ensuite. -->
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test haptique 2</title>
<style>
  body { font: 17px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f5; } }
  .btn { position: relative; display: flex; align-items: center; justify-content: center; height: 56px; margin: 12px 0; border-radius: 999px; background: #1D5FBF; color: #fff; font-weight: 600; overflow: hidden; -webkit-user-select: none; user-select: none; }
  .invisible { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; }
  p { color: #6b6b6b; font-size: 15px; }
</style></head><body>
<h1 style="font-size:22px">Test haptique n° 2</h1>
<label class="btn">4. Bouton avec interrupteur masqué<input type="checkbox" switch style="display:none"></label>
<label class="btn">5. Bouton avec interrupteur transparent<input type="checkbox" switch class="invisible"></label>
<div class="btn">6. Interrupteur transparent posé sur le bouton<input type="checkbox" switch class="invisible"></div>
<p>Touche chaque bouton plusieurs fois et dis-moi lesquels font vibrer.</p>
</body></html>
